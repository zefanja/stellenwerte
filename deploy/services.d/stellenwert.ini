; supervisord-Dienst für die App. Nach ~/etc/services.d/ kopieren, dann:
;   supervisorctl reread && supervisorctl update
[program:stellenwert]
directory=%(ENV_HOME)s/stellenwerttraining
command=node --env-file=.env build
autostart=yes
autorestart=yes
startsecs=5
; adapter-node beendet laufende Anfragen sauber bei SIGTERM
stopsignal=TERM
environment=NODE_ENV="production"
