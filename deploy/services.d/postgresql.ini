; supervisord-Dienst für die eigene PostgreSQL-Instanz im Benutzerkonto (siehe Uberlab guide_postgresql).
; Pfade an die Installation anpassen. Kein TCP, nur der Unix-Socket in ~/tmp.
[program:postgresql]
command=%(ENV_HOME)s/opt/postgresql/bin/postgres -D %(ENV_HOME)s/opt/postgresql/data -c listen_addresses='' -k %(ENV_HOME)s/tmp
autostart=yes
autorestart=yes
startsecs=10
stopsignal=INT
